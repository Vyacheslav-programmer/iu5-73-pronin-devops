[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "T20",
]
ignore = [
    "B008",
    "ANN",
    "PTH123",
    "FA102",
    "ERA001",
    "TD",
    "FIX002",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["T201", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["server", "voicegen"]
